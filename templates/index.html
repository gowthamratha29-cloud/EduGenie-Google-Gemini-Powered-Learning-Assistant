<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduGenie - Gemini Powered Learning Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header><h1>🧞 EduGenie</h1><p>Google Gemini Powered Learning Assistant</p></header>
  <main>
    <div class="tabs">
      <button class="tab active" data-mode="chat">Ask Doubt</button>
      <button class="tab" data-mode="explain">Explain Topic</button>
      <button class="tab" data-mode="quiz">Quiz</button>
      <button class="tab" data-mode="summarize">Summarize</button>
    </div>
    <textarea id="input" rows="4" placeholder="Type your question..."></textarea>
    <button id="submit">Submit</button>
    <pre id="output"></pre>
  </main>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
